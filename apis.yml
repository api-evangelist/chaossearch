aid: chaossearch

name: ChaosSearch

image: https://www.chaossearch.io/hubfs/Homepage%20Header%20Graphic.png

description: ChaosSearch provides a live analytics platform that transforms cloud storage into a searchable, SQL‑enabled and generative‑AI‑ready
  analytical database. It enables customers to ingest streaming data at scale, perform real‑time search, visualizations, and advanced analytics
  without managing infrastructure. The service supports integrations with AWS, Azure, and GCP, offering fast query performance and flexible data
  retention for operational and business use cases.

